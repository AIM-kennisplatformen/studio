services:
  application:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    container_name: studio_application
    image: studio_application
    ports:
      - "10090:10090"
      - "5173:5173"
    environment:
      - MCP_USE_OAUTH
      - BACKEND_BASE_URL
      - OAUTH_DISCOVERY_URL
      - OAUTH_CLIENT_ID
      - OAUTH_CLIENT_SECRET
      - LANGFUSE_SECRET_KEY
      - LANGFUSE_PUBLIC_KEY
      - LANGFUSE_HOST
      - OPENAI_HOST
      - OPENAI_API_KEY
      - LLM_MODEL
      - MCP_TOOL_CONFIG_PATH
      - REDIS_URL
      - POSTGRES_URL
      - PDF_STORAGE_DIR=/data/pdfs
      - PDF_API_KEYS
      - VITE_BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - VITE_DEV_SERVER_URL=${VITE_DEV_SERVER_URL:-http://localhost:5173}
    volumes:
      - .:/app
      - /app/.pixi
      - /app/src/frontend/node_modules
      - pdf_data:/data/pdfs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mcp_server_scepa_studio_net
    depends_on:
      - redis
      - studio_postgres
  redis:
    image: redis:8-alpine
    container_name: studio_redis
    ports:
      - "6379:6379"
    networks:
      - mcp_server_scepa_studio_net
  studio_postgres:
    image: postgres:18-alpine
    container_name: studio_postgres
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - mcp_server_scepa_studio_net

networks:
  mcp_server_scepa_studio_net:
    driver: bridge
    external: true # Reference the external network from MCP stack

volumes:
  postgres_data:
  pdf_data:
