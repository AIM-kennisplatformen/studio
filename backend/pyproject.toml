# ====================================
# Build system
# ====================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ====================================
# Project metadata + runtime deps
# ====================================
[project]
name = "MCP-demo"
description = "MCP demo library"
readme = "README.md"
license = { text = "NONE" }
authors = [
  { name = "RaoulG", email = "Raoul.Grouls@han.nl" },
  { name = "Hoog-V",  email = "victor.hogeweij@han.nl" },
]
classifiers = [
  "Environment :: Console",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dynamic = ["version"]

dependencies = [
  "fastmcp>=3.4.11,<4",
  "fastapi>=0.162.0",
  "langfuse>=5.0.4",
  "openai>=3.37.0",
  "loguru>=0.7.3",
  "python-dotenv>=1.2.4",
  "uvicorn[standard]>=0.54.0",
  "python-socketio>=5.17.0",
  "langchain-openai>=1.7.2",
  "langchain>=1.4.7",
  "typing-extensions>=4.16.0",
  "mcp-use>=1.7.1",
  "redis>=8.1.0",
  "asyncpg>=0.32.0",
]

# ====================================
# Dev dependencies (PEP 735 groups)
# ====================================
[dependency-groups]
dev = [
  "isort>=9.0.2",
  "mypy>=2.4.0",
  "nest-asyncio>=1.6.0",
  "pytest>=9.1.1",
  "ruff>=0.17.2",
  "toml-sort>=0.25.0"
]

# ====================================
# Testing
# ====================================
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

# ====================================
# Pixi workspace
# ====================================
[tool.pixi.workspace]
channels = [
  "https://conda.anaconda.org/conda-forge",
  "https://repo.prefix.dev/pypdfium2-public",
  "https://repo.prefix.dev/pytorch",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]


# ====================================
# Pixi environment dependencies
# ====================================
[tool.pixi.dependencies]
python = ">=3.12,<3.13"
pkg-config = ">=0.29.2"

ruff = ">=0.17.2"

mypy = ">=2.4.0"
pytest = ">=9.1.1"
# Smaller libs
einops = ">=0.8.2"
itsdangerous = ">=2.2.0"
pytorch = ">=2.14.1"
cpuonly = ">=2.0"

# Tools duplicated in project/dev groups (ok for Pixi env)
loguru = ">=0.7.3"
python-dotenv = ">=1.2.4"
# ====================================
# Pixi tasks
# ====================================
[tool.pixi.tasks]
lint = "ruff check"
typecheck = "mypy src tests"
test = "pytest -q"

# ====================================
# Pixi activation environment
# ====================================
[tool.pixi.activation.env]
PYTHONNOUSERSITE = "1"
# LD_LIBRARY_PATH  = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

# ====================================
# Platform-specific dependencies
# ====================================
[tool.pixi.target.linux-64.dependencies]
python-devtools = ">=0.12.2"

# ====================================
# Mypy config
# ====================================
[tool.mypy]
allow_redefinition = true
disable_error_code = [
  "call-arg",
  "import-untyped",
  "import-not-found",
  "call-overload",
  "arg-type",
  "misc",
]
pretty = true
exclude = ["^\\.pixi/", "^studio-project/"]
follow_imports = "skip"

# ====================================
# Ruff config
# ====================================
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C4", "PT"]

[tool.ruff]
exclude = [".pixi", "tests", "studio-project"]
